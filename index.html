<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TJ Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column built for a phone. Title, big search field, tappable suggestion rows, then one result card with a verdict badge, name, and a row per surgery. */
:root{
  --bg:#0d1117; --surface:#161b22; --raised:#1d242d; --line:#2a323d;
  --text:#eaeef3; --muted:#93a0b0; --accent:#5aa9ff; --amber:#f6b33f; --amber-bg:rgba(246,179,63,.14); --slate-bg:rgba(147,160,176,.14);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;font-size:120%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.5;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
.logo{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
header{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{flex:none}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
.sub{margin:0;color:var(--muted)}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
input[type=text]{font-family:var(--font);font-size:1.0625rem;height:62px;padding:0 16px 0 48px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--text);width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none}
input[type=text]::placeholder{color:#6b7787}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(90,169,255,.2)}
input[type=text]:disabled{opacity:.55}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.list:empty{display:none}
.row{font-family:var(--font);font-size:1rem;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;padding:10px 16px;background:none;border:0;border-top:1px solid var(--line);color:var(--text);cursor:pointer;width:100%}
.row:first-child{border-top:0}
.row:hover,.row:active{background:var(--raised)}
.row span:last-child{color:var(--muted);font-size:.875rem;white-space:nowrap}
.result{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:.875rem;font-weight:600;padding:6px 12px;border-radius:999px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.yes .badge{background:var(--amber-bg);color:var(--amber)}
.no .badge{background:var(--slate-bg);color:var(--muted)}
.name{font-size:1.65rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0;overflow-wrap:anywhere}
.meta{margin:4px 0 0;color:var(--muted)}
.dates{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.date{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:6px 12px;padding:14px 16px;background:var(--raised);border-top:1px solid var(--line)}
.date .rk{color:var(--muted);font-size:.9375rem}
.date .rv{font-size:1.0625rem;font-variant-numeric:tabular-nums;text-align:right}
.date .rv.na{color:var(--muted)}
.date:first-child{border-top:0}
.date .k{color:var(--muted);font-size:.9375rem}
.date .v{font-size:1.1875rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.875rem;font-weight:500;padding:5px 11px;border-radius:8px;background:var(--raised);border:1px solid var(--line);color:var(--text)}
.note{margin:0;color:var(--muted);font-size:.9375rem}
.foot{margin:0;color:var(--muted);font-size:.65rem}
#status{font-size:.875rem}
@media (prefers-reduced-motion:no-preference){.result{animation:in .18s ease-out}@keyframes in{from{opacity:.5;transform:translateY(4px)}}}
</style>

<main>
  <img class="logo" src="images/tj-logo.png" alt="TJ Tracker logo: a baseball player with his arm in a sling" width="960" height="595">
  <header>
    <p class="sub">See if a pitcher had his elbow fixed yet.</p>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="text" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="search" placeholder="Search a pitcher's name" aria-label="Pitcher name" disabled>
  </div>
  <div id="sugg" class="list" aria-live="polite"></div>

  <div id="out" aria-live="polite"></div>

  <p class="foot" id="status">Loading the list…</p>
  <p class="foot">Source: Jon Roegele's Tommy John Surgery List, built from public reports. A surgery that was never reported would not appear on it.</p>
</main>

<script>
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z\s]/g," ").replace(/\s+/g," ").trim();
const $=id=>document.getElementById(id);
const q=$("q"),out=$("out"),sugg=$("sugg");
let data=[];
const parseD=d=>{const m=/^(\d+)\/(\d+)\/(\d+)$/.exec(d);return m?new Date(+m[3],+m[1]-1,+m[2]):null};
const POS={P:"Pitcher",C:"Catcher",OF:"Outfielder",SS:"Shortstop","1B":"First base","2B":"Second base","3B":"Third base",IF:"Infielder"};
const HAND={R:"Throws right",L:"Throws left"};
const ORD=["1st","2nd","3rd","4th","5th"];
const longDate=s=>{const t=parseD(s);return t?t.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):s};

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function show(p){
  out.innerHTML="";sugg.innerHTML="";
  const n=p.d.length,card=el("div","result yes");
  card.append(el("span","badge",n===1?"1 surgery on record":n+" surgeries on record"));
  const head=el("div");head.append(el("h2","name",p.n));
  const meta=[POS[p.p]||p.p,p.p==="P"?HAND[p.h]:null].filter(Boolean).join(" · ");
  if(meta)head.append(el("p","meta",meta));
  card.append(head);
  const dates=el("div","dates");
  p.d.forEach((s,i)=>{const r=el("div","date"),ret=p.r&&p.r[i];
    r.append(el("span","k",(ORD[i]||(i+1)+"th")+" surgery"),el("span","v",longDate(s)),
      el("span","rk","Returned"),el("span","rv"+(ret?"":" na"),ret?longDate(ret):"TBD"));dates.append(r)});
  card.append(dates);
  const tags=[p.t,p.l].filter(Boolean);
  if(tags.length){const c=el("div","chips");tags.forEach(t=>c.append(el("span","chip",t)));card.append(c)}
  if(p.p&&p.p!=="P")card.append(el("p","note","Listed as a position player, not a pitcher."));
  out.append(card);
}
function none(text){
  out.innerHTML="";
  const card=el("div","result no");
  const badge=el("span","badge");badge.append("No surgeries, ",el("em",null,"yet"),".");
  card.append(badge,el("h2","name",text),
    el("p","note","Not on the list. Check the spelling. If it is right, no surgery has been reported for this player."));
  out.append(card);
}
function matches(text){
  const parts=norm(text).split(" ").filter(Boolean);if(!parts.length)return[];
  return data.filter(p=>parts.every(w=>p._n.includes(w)));
}
function update(){
  const text=q.value.trim();sugg.innerHTML="";out.innerHTML="";
  if(!text)return;
  const m=matches(text);
  const exact=m.filter(p=>p._n===norm(text));
  if(exact.length===1){show(exact[0]);return}
  if(m.length===1){show(m[0]);return}
  if(m.length>1||exact.length>1){
    (exact.length>1?exact:m).slice(0,8).forEach(p=>{
      const b=el("button","row");b.type="button";b.append(el("span",null,p.n),el("span",null,[p.t,p.l].filter(Boolean).join(" · ")));
      b.addEventListener("click",()=>show(p));sugg.append(b)});
    return;
  }
  if(norm(text).length>=4)none(text);
}
q.addEventListener("input",update);
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const m=matches(q.value);if(m.length)show(m[0]);else if(q.value.trim())none(q.value.trim());q.blur()}});

fetch("tj-data.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
  data=j.map(p=>(p._n=norm(p.n),p));
  let latest=null;
  data.forEach(p=>p.d.forEach(s=>{const t=parseD(s);if(t&&(!latest||t>latest))latest=t}));
  $("status").textContent=data.length.toLocaleString("en-US")+" players on file"+(latest?"; latest surgery listed "+latest.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+".":".");
  q.disabled=false;q.focus();
}).catch(()=>{$("status").textContent="The list did not load. Reload the page to retry."});
</script>

</body></html>
